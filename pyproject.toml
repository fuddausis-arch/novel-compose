[project]
name = "novel-agent"
version = "0.1.0"
description = "多 Agent 自动小说生成系统"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novel_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
