[project]
name = "novel-agent"
version = "0.1.0"
description = "多 Agent 自动小说生成系统"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7",  # 中文 embedding (bge-small-zh-v1.5)
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "fastapi>=0.111",
    "sse-starlette>=2.0",
    "slowapi>=0.1.10",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pymupdf>=1.27",
    "pillow>=10.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novel_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests against real LLM (excluded from default suite)",
    "timeout: pytest-timeout 超时标记",
]
